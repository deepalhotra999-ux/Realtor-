# Free, self-hosted services for local development. Only `db` is required.
#
#   docker compose up -d db            # Postgres 16 + PostGIS (required)
#   docker compose --profile ai up -d  # + Ollama for local AI (optional)
#   docker compose --profile full up -d  # + MinIO + Mailpit (optional)

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dwellwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dwellwise"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai", "full"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  minio:
    image: minio/minio:latest
    profiles: ["full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["full"]
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web inbox

volumes:
  pgdata:
  ollama:
  minio:
